[project]
name = "multi-agent"
version = "0.1.0"
description = "Autonomous multi-agent task orchestrator"
authors = [{ name = "hiemenz" }]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.64.0,<2",
    "slack-bolt>=1.27.0,<2",
    "aiohttp>=3.13.3,<4",
    "pillow>=11.3.0,<12",
    "pyyaml>=6.0.3,<7",
    "python-dotenv>=1.2.1,<2",
    "gitpython>=3.1.46,<4",
    "aiofiles>=24.1.0,<25",
    "tenacity>=9.1.4,<10",
    "spidev>=3.8,<4; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1,<0.8; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=0.24.0,<0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
# Scripts, not an installable package.
package = false
